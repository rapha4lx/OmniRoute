networks:
  traefik_proxy:
    external: true
services:
  chatgpt-web-codex-browser:
    build:
      context: .
      dockerfile: docker/chatgpt-web-codex-browser/Dockerfile
    image: omniroute:chatgpt-web-codex-browser
    restart: unless-stopped
    shm_size: 2gb
    volumes:
      - chatgpt-web-codex-browser-prod-data:/browser-profile
  omniroute-prod:
    build:
      args:
        OMNIROUTE_BASE_PATH: ""
      context: .
      target: runner-cli
    container_name: omniroute-prod
    depends_on:
      chatgpt-web-codex-browser:
        condition: service_started
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=20128
      - DASHBOARD_PORT=20128
      - API_PORT=20129
      - LIVE_WS_PORT=20132
      - LIVE_WS_HOST=${LIVE_WS_HOST:-127.0.0.1}
      - LIVE_WS_ALLOWED_ORIGINS=https://omnirouter.rafaelferro.dev,http://localhost:20130,http://127.0.0.1:20130
      - API_HOST=${API_HOST:-127.0.0.1}
      - DATA_DIR=/app/data
      - OMNIROUTE_BASE_PATH=
      - NEXT_PUBLIC_OMNIROUTE_BASE_PATH=
      - REDIS_URL=redis://redis:6379
      - CHATGPT_WEB_CODEX_CDP_URL=http://chatgpt-web-codex-browser:9223
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 15s
      test:
        - CMD
        - node
        - healthcheck.mjs
      timeout: 5s
    image: omniroute:prod
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_proxy
      traefik.http.routers.omniroute.rule: "Host(`omnirouter.rafaelferro.dev`)"
      traefik.http.routers.omniroute.entrypoints: websecure
      traefik.http.routers.omniroute.tls.certresolver: letsencrypt
      traefik.http.routers.omniroute.service: omniroute
      traefik.http.services.omniroute.loadbalancer.server.port: "20128"
      traefik.http.routers.omniroute-ws.rule: "Host(`omnirouter.rafaelferro.dev`) && PathPrefix(`/live-ws`)"
      traefik.http.routers.omniroute-ws.entrypoints: websecure
      traefik.http.routers.omniroute-ws.tls.certresolver: letsencrypt
      traefik.http.routers.omniroute-ws.priority: "100"
      traefik.http.routers.omniroute-ws.service: omniroute-ws
      traefik.http.services.omniroute-ws.loadbalancer.server.port: "20132"
    networks:
      - default
      - traefik_proxy
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${PROD_DASHBOARD_PORT:-20130}:20128"
      - "${APP_BIND_HOST:-127.0.0.1}:${PROD_API_PORT:-20131}:20129"
      - "${APP_BIND_HOST:-127.0.0.1}:${PROD_LIVE_WS_PORT:-20132}:20132"
    restart: unless-stopped
    stop_grace_period: 40s
    volumes:
      - omniroute-prod-data:/app/data
  redis:
    command: redis-server --save 60 1 --loglevel warning
    container_name: omniroute-redis-prod
    healthcheck:
      interval: 10s
      retries: 3
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 5s
    image: redis:8.6.5-alpine
    restart: unless-stopped
    volumes:
      - redis-prod-data:/data
volumes:
  chatgpt-web-codex-browser-prod-data:
    name: omniroute-chatgpt-web-codex-browser-prod-data
  omniroute-prod-data:
    name: omniroute-prod-data
  redis-prod-data:
    name: redis-prod-data
